# Ployz fork: build the agent image natively per arch and publish
# ghcr.io/getployz/corrosion:<commit date>-<sha12> once the tests pass.
name: Ployz image

on:
  push:
    branches: [ployz]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/getployz/corrosion

jobs:
  ci:
    uses: ./.github/workflows/ployz-ci.yml

  build:
    needs: ci
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
            lg_page: ""
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            lg_page: "14"
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ployz/Dockerfile
          platforms: ${{ matrix.platform }}
          build-args: JEMALLOC_SYS_WITH_LG_PAGE=${{ matrix.lg_page }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}
      - run: echo "${{ steps.build.outputs.digest }}" > "digest-${{ strategy.job-index }}"
      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ strategy.job-index }}
          path: digest-${{ strategy.job-index }}

  publish:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: digest-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tag the multi-arch index
        run: |
          tag="$(TZ=UTC git log -1 --date=format-local:%Y%m%d --format=%cd)-$(git rev-parse --short=12 HEAD)"
          docker buildx imagetools create -t "$IMAGE:$tag" $(sed "s|^|$IMAGE@|" digest-*)
          docker buildx imagetools inspect "$IMAGE:$tag"
          echo "Published \`$IMAGE:$tag\`" >> "$GITHUB_STEP_SUMMARY"
